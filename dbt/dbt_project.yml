name: ads_analytics
version: "1.0.0"
profile: ads_analytics
require-dbt-version: [">=1.10.0", "<2.0.0"]

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
clean-targets: ["target", "dbt_packages"]

vars:
  # Le modèle incrémental retraite les N derniers jours à chaque exécution (corrections tardives).
  lookback_days: 7
  # Date à partir de laquelle tout retraiter ponctuellement : --vars '{reprocess_from: 2026-01-01}'.
  reprocess_from: null

models:
  ads_analytics:
    +labels:
      projet: media-data-platform
      gere_par: dbt
    staging:
      +schema: staging
      +materialized: view
    intermediate:
      +schema: staging
      +materialized: view
    marts:
      +schema: marts
      +materialized: table

data_tests:
  ads_analytics:
    +severity: error
