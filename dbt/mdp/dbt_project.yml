name: mdp
version: '2.0.0'
profile: mdp
require-dbt-version: [">=1.10.0", "<2.0.0"]

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]

clean-targets: ["target", "dbt_packages"]

vars:
  raw_dataset: mdp_raw
  # Fenêtre de retraitement de l'incrémental : les corrections tardives des plateformes
  # publicitaires touchent typiquement les derniers jours déjà chargés.
  lookback_days: 7

models:
  mdp:
    staging:
      +materialized: view
      +schema: staging
      +tags: [staging]
    intermediate:
      +materialized: view
      +schema: intermediate
      +tags: [intermediate]
    marts:
      +schema: marts
      +tags: [marts]

dispatch:
  - macro_namespace: mdp
    search_order: ['mdp']
