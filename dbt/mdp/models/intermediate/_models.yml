version: 2

models:
  - name: int_campaign_daily_unified
    description: "Performances journalières unifiées (Google Ads + Meta Ads). Grain : report_date × campaign_id × platform."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments: {combination_of_columns: [report_date, campaign_id, platform]}
    columns:
      - name: platform
        data_tests:
          - not_null
          - accepted_values: {arguments: {values: [google_ads, meta_ads]}}
      - name: data_mode
        data_tests:
          - accepted_values: {arguments: {values: [real, simulated]}}
