unit_tests:
  - name: stg_meta_ads_keeps_only_the_latest_ingestion_per_day_and_campaign
    description: "Une réingestion (ancien mode append, correction tardive) ne doit pas dupliquer le grain."
    model: stg_meta_ads__campaign_daily
    given:
      - input: source('raw', 'meta_ads_campaign_daily')
        rows:
          - {date: 2024-01-01, campaign_id: c1, campaign_name: Old, impressions: 100, clicks: 10, spend_usd: 5.0, data_mode: simulated, ingested_at: 2024-02-01 00:00:00, extract_run_id: run-a}
          - {date: 2024-01-01, campaign_id: c1, campaign_name: New, impressions: 90,  clicks: 9,  spend_usd: 4.5, data_mode: simulated, ingested_at: 2024-02-08 00:00:00, extract_run_id: run-b}
          - {date: 2024-01-02, campaign_id: c1, campaign_name: New, impressions: 80,  clicks: 8,  spend_usd: 4.0, data_mode: simulated, ingested_at: 2024-02-01 00:00:00, extract_run_id: run-a}
          - {date: 2024-01-01, campaign_id: null, campaign_name: Orphan, impressions: 1, clicks: 0, spend_usd: 0.0, data_mode: simulated, ingested_at: 2024-02-01 00:00:00, extract_run_id: run-a}
    expect:
      rows:
        - {report_date: 2024-01-01, campaign_id: c1, campaign_name: New, impressions: 90, clicks: 9, spend_usd: 4.5, extract_run_id: run-b}
        - {report_date: 2024-01-02, campaign_id: c1, campaign_name: New, impressions: 80, clicks: 8, spend_usd: 4.0, extract_run_id: run-a}

  - name: stg_google_ads_ties_on_ingested_at_are_broken_deterministically
    model: stg_google_ads__campaign_daily
    given:
      - input: source('raw', 'google_ads_campaign_daily')
        rows:
          - {date: 2024-01-01, campaign_id: c1, impressions: 100, clicks: 10, cost_usd: 5.0, data_mode: simulated, ingested_at: 2024-02-01 00:00:00, extract_run_id: run-a}
          - {date: 2024-01-01, campaign_id: c1, impressions: 200, clicks: 20, cost_usd: 6.0, data_mode: simulated, ingested_at: 2024-02-01 00:00:00, extract_run_id: run-b}
    expect:
      rows:
        - {report_date: 2024-01-01, campaign_id: c1, impressions: 200, clicks: 20, cost_usd: 6.0, extract_run_id: run-b}
