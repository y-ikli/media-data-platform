version: 2

sources:
  - name: raw
    description: >
      Zone raw alimentée par `mdp-ingest` (une table par source). Chaque chargement remplace une fenêtre de
      dates ; les lignes portent `ingested_at`, `extract_run_id` et `data_mode` (real | simulated).
    schema: "{{ var('raw_dataset') }}"
    loaded_at_field: ingested_at
    freshness:
      warn_after: {count: 7, period: day}
      error_after: {count: 30, period: day}
    tables:
      - name: google_ads_campaign_daily
        description: "Performances journalières par campagne Google Ads (simulées : extraction réelle non implémentée)."
        columns:
          - name: date
            data_tests: [not_null]
          - name: campaign_id
            data_tests: [not_null]
          - name: campaign_name
          - name: impressions
            data_tests: [not_null]
          - name: clicks
            data_tests: [not_null]
          - name: conversions
            description: Nombre de conversions ; NULL quand la source ne les suit pas (différent de 0).
          - name: conversion_value
            description: Valeur des conversions en USD ; NULL si non suivie.
          - name: ingested_at
            data_tests: [not_null]
          - name: extract_run_id
            data_tests: [not_null]
          - name: source
          - name: data_mode
            data_tests:
              - not_null
              - accepted_values: {arguments: {values: [real, simulated]}}
          - name: cost_usd
            description: Dépense en USD.
            data_tests: [not_null]
      - name: meta_ads_campaign_daily
        description: Performances journalières par campagne Meta Ads (Facebook/Instagram).
        columns:
          - name: date
            data_tests: [not_null]
          - name: campaign_id
            data_tests: [not_null]
          - name: campaign_name
          - name: impressions
            data_tests: [not_null]
          - name: clicks
            data_tests: [not_null]
          - name: conversions
            description: Somme des actions d'achat configurées ; NULL si le pixel ne les remonte pas.
          - name: conversion_value
            description: Valeur des achats en USD ; NULL si non suivie.
          - name: spend_usd
            description: Dépense en USD.
            data_tests: [not_null]
          - name: likes
          - name: comments
          - name: shares
          - name: video_views
          - name: page_engagement
          - name: ingested_at
            data_tests: [not_null]
          - name: extract_run_id
            data_tests: [not_null]
          - name: source
          - name: data_mode
            data_tests:
              - not_null
              - accepted_values: {arguments: {values: [real, simulated]}}
