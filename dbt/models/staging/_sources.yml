version: 2

sources:
  - name: ads_raw
    description: Zone raw, alimentée par l'ingestion Python (adsdata-ingest).
    database: "{{ env_var('GCP_PROJECT_ID') }}"
    schema: "{{ env_var('BQ_RAW_DATASET', 'ads_raw') }}"
    config:
      loaded_at_field: ingested_at
      freshness:
        warn_after: {count: 2, period: day}
        error_after: {count: 4, period: day}
    tables:
      - name: google_ads_campaign_daily
        description: Google Ads, une ligne par campagne et par jour (coûts en micros).
        columns:
          - name: date
            data_tests: [not_null]
          - name: campaign_id
            data_tests: [not_null]
      - name: meta_ads_campaign_daily
        description: Meta Ads, une ligne par campagne et par jour (dépense dans la devise du compte).
        columns:
          - name: date
            data_tests: [not_null]
          - name: campaign_id
            data_tests: [not_null]
