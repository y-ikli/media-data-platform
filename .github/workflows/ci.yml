name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Lint et tests Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check src tests
      - name: Tests unitaires (couverture minimale 85 %)
        run: uv run pytest tests/unit --cov

  dbt:
    name: dbt sur DuckDB (modèles, tests de données, tests unitaires, incrémental)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --group dev
      - name: dbt deps
        run: uv run dbt deps --project-dir dbt/mdp --profiles-dir dbt/mdp
        env:
          DBT_TARGET: duckdb
      - name: SQL lint
        run: |
          uv run python -m mdp.dev.duckdb_fixtures --path dbt/mdp/target/ci.duckdb
          DBT_TARGET=duckdb DBT_DUCKDB_PATH=$PWD/dbt/mdp/target/ci.duckdb uv run sqlfluff lint dbt/mdp/models
      - name: Tests dbt (échec bloquant)
        run: uv run pytest tests/dbt -m dbt

  bigquery-parse:
    name: dbt parse (cible BigQuery, sans identifiants)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --group dbt
      - run: uv run dbt deps --project-dir dbt/mdp --profiles-dir dbt/mdp
        env: { DBT_TARGET: dev, GCP_PROJECT_ID: ci-project }
      - name: Le projet se charge avec l'adaptateur BigQuery
        run: uv run dbt parse --project-dir dbt/mdp --profiles-dir dbt/mdp
        env: { DBT_TARGET: dev, GCP_PROJECT_ID: ci-project }
