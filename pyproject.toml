[project]
name = "media-data-platform"
version = "0.2.0"
description = "Pipeline ELT de données publicitaires (Meta Ads, Google Ads) vers BigQuery, modélisé avec dbt"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "google-cloud-bigquery>=3.14.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
# API réelles (non nécessaires en mode simulé)
meta = ["facebook-business>=18.0.2"]

[project.scripts]
mdp-ingest = "mdp.ingestion.cli:main"

[dependency-groups]
dbt = ["dbt-bigquery>=1.10.0,<2"]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "sqlfluff>=3.0.0",
    "sqlfluff-templater-dbt>=3.0.0",
    "dbt-duckdb>=1.10.0,<2",
    "duckdb>=1.0.0",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mdp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
markers = ["dbt: exécute dbt sur DuckDB (plus lent)"]

[tool.coverage.run]
source = ["src/mdp"]

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4"]
